; PHP settings of the lab (app and DB-building container).
memory_limit=512M
expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
; a blocked outbound call fails fast instead of hanging (as in the measurement image)
default_socket_timeout=3
; The app and this repository are mounted read-only and do not change while the lab runs.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
realpath_cache_size=4M
realpath_cache_ttl=600
