[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; The container runs as an ordinary user, so there is no user/group to switch to.
listen = 9000
pm = static
pm.max_children = 16
; The pool hands the container's environment (database host, run id, ...) on to the entry script.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
