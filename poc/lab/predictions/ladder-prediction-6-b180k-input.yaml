# Calibration scenarios and the prediction scenarios s-1 to s-5 of the sixth lab backtest, test B at 180,000 rows (docs/simulator-spec.md sections 3.4, 7.2, 7.4.2, 7.4.3, 7.4.4 and 7.4.5).
#
# Made from poc/lab/predictions/ladder-prediction-5-b170k-input.yaml by changing the count of the five target scenarios from 170,000 to 180,000. The calibration part (cal-1 to cal-7, `observed` untouched), the mixes of routes
# and the three limits under `resources:` (the application's run-time limit lifted, so none is given; memory_limit 4G; the database's limit of 65,535 values in one statement) are those of the fifth round, unchanged.
# The preparation of each step (the time discarded at its start) is not an input here: the prediction tool writes it per step with --warmup-from-marks (section 7.4.5).
# The request timeout of the measurement is 1,800 seconds (section 7.4.4); the prediction is made with --drop-marked-routes, so the allocation block states which routes are taken out and the rps that is handed on.
#
# Inputs (sha256 of the files as read, unchanged from the fourth round):
#   cal-1: plan 989cddd771f6bfd8eaefeccb5de5a71e13bb51ef07dcb4bff0a2068bb4769406, record aeab96af1f5fca8c1364aba8dcd5ef34c17931b39d083f37ad310eaa9a3f492d
