name: peak-sim-dev

services:
  php-dev:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    image: peak-sim-php-dev:${PHP_VERSION:-8.3}
    # Run as the host user so vendor/ and generated files are not root-owned.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
    volumes:
      - ..:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sleep", "infinity"]

  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
