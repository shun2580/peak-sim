    rps:
      "GET /books/{bookSlug}/chapter/{chapterSlug}/references": 0.2
      "GET /books/{bookSlug}/export/zip": 0.05
      "GET /books/{bookSlug}/page/{pageSlug}/references": 0.2
      "GET /books/{slug}": 0.05
      "GET /books/{slug}/references": 0.2
