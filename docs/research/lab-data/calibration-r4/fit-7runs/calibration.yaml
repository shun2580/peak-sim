# Calibration scenarios of the lab backtest, and nothing else (docs/simulator-spec.md sections 3.4 and 7.2).
#
# Made by poc/lab/scenarios/make-calibration-scenario from the plan and the record of each calibration run; nothing in it is typed
# by hand. There is NO `target` scenario: bin/simulate has nothing to predict and stops after the calibration.
# `observed` is the utilization of the database CPU over the kept window of the run (0 to 1).
