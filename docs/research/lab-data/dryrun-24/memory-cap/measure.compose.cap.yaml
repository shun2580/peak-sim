# Measurement stack for the runtime PoC. The target app's code runs ONLY in measure-php, which sits on an
# internal network with the DB service and nothing else. No port is published.
#
# Host paths come from the environment (set by bin/_stack.sh):
#   PEAK_REPO_ROOT             this repository (mounted read-only: poc/runtime and vendor)
#   PEAK_APP_ROOT              the target app (mounted read-only)
#   PEAK_OUT_DIR               where run logs go (the only writable mount)
#   PEAK_MEASURE_DB_ROOT_PASSWORD / PEAK_MEASURE_DB_PASSWORD / PEAK_MEASURE_RUN_ID   throwaway values
#   PEAK_PHP_IMAGE             optional: run in this already built PHP image instead of peak-measure-php:<PHP_VERSION>
#                              (an app that needs extensions the default image lacks). Nothing in the safety settings
#                              below depends on the image.
name: peak-measure

networks:
  measure-internal:
    internal: true

volumes:
  measure-dbdata: {}

services:
  measure-db:
    image: mysql:8.4.7
    networks: [measure-internal]
    environment:
      MYSQL_ROOT_PASSWORD: ${PEAK_MEASURE_DB_ROOT_PASSWORD:?set by bin/_stack.sh}
      # Creates the `measure` user with no privilege; mysql-init/10-measure-user.sql grants the wildcard.
      MYSQL_USER: measure
      MYSQL_PASSWORD: ${PEAK_MEASURE_DB_PASSWORD:?set by bin/_stack.sh}
    volumes:
      - ${PEAK_REPO_ROOT:?set by bin/_stack.sh}/poc/runtime/compose/mysql-init:/docker-entrypoint-initdb.d:ro
      - ${PEAK_REPO_ROOT:?set by bin/_stack.sh}/poc/runtime/compose/mysql-conf:/etc/mysql/conf.d:ro
      # A named volume (compose names it <project>_measure-dbdata), so a kept database can be found by its project label.
      # bin/stack down keeps it; only down --purge removes it.
      - measure-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    # ports: none. The DB is reachable only from measure-php.

  measure-php:
    build:
      context: ~/projects/peak-sim-trials/_scratch/dryrun24/rep/poc/runtime/compose
      dockerfile: Dockerfile.measure
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    # PEAK_PHP_IMAGE: another, already built image (bin/stack build-image). With it set, nothing is built.
    image: ${PEAK_PHP_IMAGE:-peak-measure-php:${PHP_VERSION:-8.3}}
    networks: [measure-internal]
    # Memory cap of the measured app's container only (never the database). A process killed for memory ends that request;
    # the container (sleep infinity) and the database go on. memswap_limit equal to mem_limit leaves no swap to hide it.
    mem_limit: ${PEAK_MEASURE_PHP_MEM:-6g}
    memswap_limit: ${PEAK_MEASURE_PHP_MEM:-6g}
    read_only: true
    tmpfs:
      - /tmp:rw,size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    working_dir: /peak-sim
    volumes:
      - ${PEAK_REPO_ROOT:?set by bin/_stack.sh}:/peak-sim:ro
      - ${PEAK_APP_ROOT:-${PEAK_REPO_ROOT}/fixtures/laravel-app}:/app:ro
      - ${PEAK_OUT_DIR:?set by bin/_stack.sh}:/out:rw
    environment:
      HOME: /tmp
      PEAK_MEASURE_DB_HOST: measure-db
      PEAK_MEASURE_DB_USER: measure
      PEAK_MEASURE_DB_PASSWORD: ${PEAK_MEASURE_DB_PASSWORD:?set by bin/_stack.sh}
      PEAK_MEASURE_RUN_ID: ${PEAK_MEASURE_RUN_ID:?set by bin/_stack.sh}
      PEAK_MEASURE_APP_ROOT: /app
      PEAK_MEASURE_OUT_DIR: /out
    depends_on:
      measure-db:
        condition: service_healthy
    command: ["sleep", "infinity"]
